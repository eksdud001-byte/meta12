<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100vw;
      }
      .menu {
        width: 100%;
        display: flex;
        gap: 20px;
        padding: 20px;
        align-items: center;
      }
      .link {
        display: flex;
        gap: 20px;
      }
      .info {
        width: 100%;
        height: 500px;
        background-image: linear-gradient(to bottom, blue, lightblue);
      }
      .content {
        width: 100%;
        height: 500px;
        background-color: lightblue;
      }
      .bottom {
        width: 100%;
        height: 400px;
        background-color: lightgreen;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="menu">
        <div class="logo"><img src="https://picsum.photos/100/40" /></div>
        <div class="link">
          <div>성악학원 소개</div>
          <div>성악강사 이력</div>
          <div>수업시간표와 수업료</div>
          <div>위치 및 오시는 길</div>
        </div>
      </div>
      <div class="info"></div>
      <div class="content"></div>
      <div class="bottom"></div>
    </div>
  </body>
</html>
