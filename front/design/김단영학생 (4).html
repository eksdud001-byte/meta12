<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100vw;
      }
      .menu {
        width: 100%;
        display: flex;
        gap: 20px;
        padding: 20px;
        align-items: center;
      }
      .link {
        display: flex;
        gap: 100px;
      }
      .info {
        width: 100%;
        height: 700px;
        background-image: linear-gradient(
          to bottom,
          rgb(9, 3, 43),
          rgb(174, 79, 230)
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }
      .box1 {
        width: 500px;
        border-radius: 25px;
        background-color: rgb(59, 75, 218);
        padding: 20px;
        text-align: center;
        color: rgb(248, 239, 239);
        font-size: 20px;
      }
      .box2 {
        color: rgb(243, 239, 239);
        font-size: 50px;
        text-align: center;
        padding: 30px;
        font-weight: bold;
        margin: 10px;
      }
      .box3 {
        color: rgb(243, 237, 237);
        font-size: 30px;
        text-align: center;
        padding: 0px;
      }
      .box4 {
        color: rgb(250, 243, 243);
        text-align: center;
        padding: 10px;
        font-size: 20px;
      }
      .box5 {
        color: rgb(245, 239, 239);
        text-align: center;
        font-size: 20px;
      }
      .content {
        width: 100%;
        height: 500px;
        background-color: rgb(174, 79, 230);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }
      .bottom {
        width: 100%;
        height: 400px;
        background-image: linear-gradient(
          to bottom,
          rgb(174, 79, 230),
          rgb(9, 3, 43)
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }
      .box6 {
        width: 500px;
        border-radius: 25px;
        background-color: rgb(65, 69, 102);
        padding: 40px;
        text-align: center;
        color: rgb(248, 239, 239);
        opacity: 1;
        text-align: center;
        font-size: 20px;
        word-spacing: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="menu">
        <div class="logo"><i class="fa-solid fa-bars"></i></div>
        <div class="link">
          <div>성악학원 소개</div>
          <div>성악강사 이력</div>
          <div>수업시간표와 수업료</div>
          <div>위치 및 오시는 길</div>
        </div>
      </div>
      <div class="info">
        <div class="box1">
          <span style="font-size: 30px">&#127908;</span> 단쌤's 뮤직클래스에 온
          것을 환영합니다.
        </div>
        <div class="box2">
          목소리 때문에 고민을 겪고<br />
          힘들어하신 분들 여기로 오세요.
        </div>
        <div class="box3">나도 성악가처럼 만들고 싶다면 연락주세요</div>
        <div class="box4">
          <span style="font-size: 20px">&#128386;</span>eksdud3528@naver.com
        </div>
        <div class="box5">
          <span style="font-size: 20px">&#128222;</span>01071105839
        </div>
      </div>

      <div class="content">
        <div class="slider-container">
          <div class="slider-wrapper">
            <div class="slide">
              <img src="./성악가 4.jpg" alt="슬라이드 1" />
            </div>
            <div class="slide">
              <img src="./성악가1.jpg" alt="슬라이드 2" />
            </div>
            <div class="slide">
              <img src="./성악가2.jpg" alt="슬라이드 3" />
            </div>
          </div>

          <div class="dots-container"></div>
        </div>
      </div>
      <div class="bottom">
        <div class="box6">이태리곡 독일곡 프랑스곡 러시아곡 한국가곡</div>
      </div>
      <i class="fa-solid fa-bars"></i>
    </div>
  </body>
  <script>
    let currentIndex = 0;
    let slideInterval;
    // querySelectorAll은 slide 클래스 모두를 배열로 저장
    const slides = document.querySelectorAll(".slide");
    const sliderWrapper = document.querySelector(".slider-wrapper");
    const dotsContainer = document.querySelector(".dots-container");

    // 이전(왼쪽) 슬라이드로 이동. 목적은 보여줘야할 슬라이드의 index를 찾는것
    function prevSlide() {
      if (currentIndex == 0) {
        currentIndex = slides.length - 1;
      } else {
        currentIndex--;
      }
      sliderWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
    // 다음(오른쪽) 슬라이드로 이동. 목적은 보여줘야할 슬라이드의 index를 찾는것
    function nextSlide() {
      if (currentIndex == slides.length - 1) {
        currentIndex = 0;
      } else {
        currentIndex++;
      }
      sliderWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    function startAutoSlide() {
      slideInterval = setInterval(nextSlide, 3000);
    }
  </script>
</html>
