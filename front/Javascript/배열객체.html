<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //1. 배열 (Array)은 자바스크립트의 내장 객체중 가장 많이 쓰이는 자료형
      //여러개의 데이터를 함께 제어하기 위한 사용함

      //정의하는 법
      let arr1 = new Array(); //빈 배열 //소괄호가 붙은 것은 함수다. 함수기 때문에 일을 한다.
      // 주소를 여기 변수(arr1)에다가 쏙 들어가주는 역할을 한다.
      let arr2 = new Array(4); //배열 크키를 지정할 수 있음.
      //사실 이 두가지 방법은 잘 안쓰인다.
      //let arr3 = []; //빈 배열
      let arr3 = ["one", "two", "three", "four"]; //가장 많이 쓰이는 정의법.

      let arr4 = Array("one", "two", "three", "four");

      //예를 들어 실제 많이 쓰이는.
      //new Array () 문법 대신 아래와 같이 간결하게 빈 배열을 만들고 필요한 데이터를 인덱스별로
      //하나씩 입력하는 방식으로 배열을 생성함.
      let numbers = [];
      for (let i = 0; i < 5; i++) {
        numbers[i] = i * 10;
      }
      console.log(numbers);
      console.log(numbers.length); // 배열의 길이. 5

      //2. 배열의 개체의 다양한 메서드 (교과서 594페이지 참조)
      //다 외우지 않아도 된다. 어떤 기능을 하는지만 알아도 된다.
      // 자세히 기억하면 좋지만 간단하게만 기억해도 좋다.(596 페이지)
      // 1) concat () : //메서드 때문에 소괄호가 붙는다.
      // 배열 두개를 합쳐서 새로운 배열을 만든다.

      let nums = [1, 2, 3];
      let chars = ["a", "b", "c", "d"];
      let numChars = nums.concat(chars);
      console.log(numChars);

      //2) join() : 각 요소를 연결해서 하나의 문자열로 만든다.
      // (중간에 구분자를 넣을  수 있음)
      let string1 = nums.join(", "); //join아러는 녀석을 쓸모가 많습니다.
      console.log(string1); //1,2,3 (쉼표가 구분자로 추가됨)
      let string2 = chars.join("_");
      console.log(string2); //a_b_c_d (언더스코어가 구분자)\

      let date = ["2026", "01", "19"];
      let dateToString = date.join("_");
      console.log(dateToString); // 2016-01-19

      //3) filter(항상 조건이 )//책에서 다루지 않는 훨씬 더 중요한 3가지가 있다~!
      // **중요!!) 조건에 맞는 요소만 골라서 새로운 배열을 만든다.

      const integers = [1, 2, 3, 4, 5, 6];
      const evenNumbers = integers.filter((num) => num % 2 == 0); //짝수만 골라담기
      console.log(evenNumbers); // [2,4,6]
      //맵도 같은 구조로 되어 있어서 이것을 이해하면 맵도 쉽게 이해할 수 있다.

      //함수

      //4) map (애로형태)
      // **중요!! 모든 요소를 변화해서 새로운 배열을 만든다.\

      const prices = [10000, 30000, 50000];
      const discount = prices.map((p) => p * 0.8); //20% 할인
      console.log(discounts); // [8000, 24000, 40000]
      //   map을 사용해서 바꾸겠다. 애로형때;

      const users = [
        { name: "철수", age: 18 },
        { name: "민수", age: 25 },
        { name: "영희", age: 22 },
      ];
      const adultNames = users.filter((u) => u.age >= 19).map((u) => u.name);

      console.log(adultNames); // ["민수", "영희"]

      // 5) indexOF (검색)
      const fruits = ["사과", "바나나", "딸기"];
      const index = fruits.indexOf("바나나");
      cosole.log(index); //.1

      // 6) splice( ) 추가 삭제
      // 원하는 위치(인덱스)에 요소를 추가, 삭제한다. 추가와 삭제가 공존~!
      // 인수 : 함수 또는 메서드의 () 안에 들어가는 값
      // 첫번째 인수는 삭제할 인덱스 넘버
      // 두번째 인수는 삭제할 아이템 개수
      // 세번째 인수는 추가할 아이템

      let study = ["html", "css", "javascript", "jquery", "react", "nodejs"];
      let js = study.splice(2); //2번 인덱스부터 삭제, 두번째 인수가 없으면
      // 끝까지 모두!
      // study 배열에서는 삭제가 발생하고 새로 만든 js에는 삭제한 데이터가 들어감
      console.log(study); // ['html', 'css']
      console.log(js); // ['javascript', 'jqery', 'react', 'nodejs']
      let jquery = js.splice(1, 1); //1번 인덱스부터 1개 삭제
      consoloe.log(js); // ['javascript', 'react', 'nodejs']
      console.log(jquery); //['jqery']

      let modernJs = js.splice(1, 0, "typescript");
      //1번 인덱스부터 0개 삭제, typsecript를 추가
      console.log(js); // ['javascript', 'typescript, 'react', 'nodejs']
      console.log(modernJs); // [] 빈 배열
      //삭제한 것이 없어서 빈배열이 나옴.

      // 7) slice ()
      // 특정 인덱스 범위의 요소를 복사한다. 원본에서 삭제가 발생하지 않는다.
      // 첫번째 인수는 (복사)삭제할 인덱스
      // 두번째 인수는 (복사)삭제할 인덱스 범위
      let colors = ["red", "green", "blue", "white", "black"];
      let sliced1 = colors.slice(2); // 2번 인덱스부터 끝까지
      let sliced2 = colors.slice(2, 4); // 2번 인덱스부터 4번 인덱스 전까지
      console.log(sliced1); // ['blue', 'white', 'black']
      console.log(sliced2); // ['blue', 'white']
    </script>
  </body>
</html>
