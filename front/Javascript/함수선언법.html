<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //**함수의 선언 방법 4가지 **
      // 1.function 예약어를 이용한 호이스팅이 가능한 선언법
      // function foo() {}
      function addNumber(num1, num2) {
        let sum = num1 + num2;
        return sum;
      }
      console.log(addNumber(2, 3)); //5

      //2. function 예약어를 이용한 함수이름이 없는 "익명함수" 선언법
      // const foo = function(){}
      let sum = function (num1, num2) {
        return num1 + num2;
      };
      console.log(sum(2, 3));
    </script>
  </body>
</html>
